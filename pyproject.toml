[project]
name = "beai-rag"
version = "0.1.0"
description = "BEAI Studio - Knowledge Base & RAG module (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = ["beai-rag-core", "beai-rag-api", "beai-ingestion-worker", "beai-embed-server"]

[tool.uv]
package = false
# Only resolve for the platforms we build on (avoids fetching wheels for s390x etc.).
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin'",
]

[tool.uv.sources]
beai-rag-core = { workspace = true }
beai-rag-api = { workspace = true }
beai-ingestion-worker = { workspace = true }
beai-embed-server = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# CPU-only torch (product decision 2026-10-15: no NVIDIA CUDA wheels). Used by Docling in the
# ingestion worker and by the CPU embed-server.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/beai_rag_core", "services/rag-api", "services/ingestion-worker", "services/embed-server"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "mypy>=1.15",
  "ruff>=0.11",
  "testcontainers>=4.10",
  "pip-licenses>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/rag-api/app/db/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PTH", "T20"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker", "beai_rag_core", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "RUF001"]  # multilingual test data
"scripts/**" = ["T20"]
"eval/**" = ["T20", "RUF001", "S311", "SIM905"]
"services/ingestion-worker/worker/chunking/sentences.py" = ["RUF001"]  # CJK/Arabic punctuation

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["packages/beai_rag_core", "services/rag-api", "services/ingestion-worker", "services/embed-server"]
explicit_package_bases = true
exclude = ["services/rag-api/app/db/alembic/versions/"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "aiobotocore.*", "botocore.*", "testcontainers.*", "lxml.*", "fastembed.*", "trafilatura.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]
filterwarnings = [
  "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:Api key is used with an insecure connection:UserWarning",
]
