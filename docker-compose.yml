# BEAI RAG dev stack.
#   docker compose up -d                          -> infrastructure only (make up)
#   docker compose --profile app up -d            -> + rag-api + ingestion-worker
#   docker compose --profile cpu-models up -d     -> + TEI on CPU (embeddings, no GPU)
#   docker compose --profile gpu up -d            -> + TEI on GPU (vLLM / re-ranker: Phases 3-4)
name: beai-rag

x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 30

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change-me}
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      # The image has no curl/wget; probe the HTTP port with bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      <<: *hc

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beai
      POSTGRES_PASSWORD: beai
      POSTGRES_DB: beai_rag
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beai -d beai_rag"]
      <<: *hc

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *hc

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      <<: *hc

  seaweedfs:
    # S3-compatible object storage for dev (Apache-2.0). Prod uses S3-compatible storage.
    # Credentials live in deploy/dev/seaweedfs-s3.json and must match S3_ACCESS_KEY/S3_SECRET_KEY.
    # See docs/decisions/0003-dev-infrastructure.md.
    image: chrislusf/seaweedfs:4.47
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
    ports: ["9000:8333"]
    volumes:
      - seaweedfs_data:/data
      - ./deploy/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      <<: *hc

  rag-api:
    build:
      context: .
      dockerfile: services/rag-api/Dockerfile
    profiles: ["app"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://beai:beai@postgres:5432/beai_rag
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://seaweedfs:8333
    ports: ["8000:8000"]
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    profiles: ["app"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://beai:beai@postgres:5432/beai_rag
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://seaweedfs:8333
      EMBED_URL: ${EMBED_URL_IN_COMPOSE:-http://tei:80}
    volumes: [model_cache:/models]
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}

  # Embedding server (Text Embeddings Inference). Whether TEI serves the chosen model is
  # verified in docs/decisions/0001-models.md; if not, EMBED_PROVIDER=vllm is the fallback.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:1.8.3
    profiles: ["gpu"]
    # --pooling: TEI cannot read harrier's sentence-transformers config, so set it explicitly.
    command: ["--model-id", "${EMBED_MODEL:-microsoft/harrier-oss-v1-0.6b}", "--revision", "${EMBED_MODEL_REVISION:-f9b9dc8d367d443f2479d27aa5d8d2850c0774ee}",
              "--pooling", "last-token", "--auto-truncate", "--max-batch-tokens", "16384"]
    ports: ["8080:80"]
    volumes: [model_cache:/data]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  tei-cpu:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    profiles: ["cpu-models"]
    # CPU: keep the batch budget small (a 16k-token warm-up needs ~16 GB RAM on CPU).
    command: ["--model-id", "${EMBED_MODEL:-microsoft/harrier-oss-v1-0.6b}", "--revision", "${EMBED_MODEL_REVISION:-f9b9dc8d367d443f2479d27aa5d8d2850c0774ee}",
              "--pooling", "last-token", "--auto-truncate", "--max-batch-tokens", "4096"]
    ports: ["8080:80"]
    volumes: [model_cache:/data]

volumes:
  model_cache:
  qdrant_data:
  postgres_data:
  seaweedfs_data:
