# BEAI RAG dev stack.
#   docker compose up -d                      -> infrastructure + rag-api
#   docker compose --profile gpu up -d        -> + TEI / vLLM / re-ranker (added in Phases 2-4)
name: beai-rag

x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 30

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change-me}
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      # The image has no curl/wget; probe the HTTP port with bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      <<: *hc

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beai
      POSTGRES_PASSWORD: beai
      POSTGRES_DB: beai_rag
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beai -d beai_rag"]
      <<: *hc

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *hc

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      <<: *hc

  minio:
    # Official minio/minio images are no longer published on Docker Hub; pgsty/minio is a
    # maintained build of the same server. Dev only - prod uses S3-compatible storage.
    # See docs/decisions/0003-dev-infrastructure.md.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      <<: *hc

  rag-api:
    build:
      context: .
      dockerfile: services/rag-api/Dockerfile
    profiles: ["app"]
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://beai:beai@postgres:5432/beai_rag
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}

volumes:
  qdrant_data:
  postgres_data:
  minio_data:
