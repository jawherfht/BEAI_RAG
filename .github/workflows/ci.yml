# CI skeleton (spec section 14). Stages are added as phases land:
# lint -> type-check -> unit -> integration -> isolation suite -> eval subset -> images -> helm lint
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make typecheck

  unit:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -m "not integration"

  integration:
    needs: [unit]
    runs-on: ubuntu-latest  # Docker is available; testcontainers starts the dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -m integration

  # Eval subset (spec section 12): 30 questions (10 per KB) through /test with the real models
  # (CPU embed-server + re-ranker) and the dev LLM; fails if a metric drops > 3 points from
  # eval/ci/baseline.json. Needs the LLM_API_KEY secret, so it is skipped on fork PRs.
  eval-subset:
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: qwen/qwen3.8-27b
      LLM_THINKING_SWITCH: reasoning_effort
      LLM_TEMPERATURE: "0"  # fewer run-to-run flips on a 30-question set
      EMBED_PROVIDER: local
      EMBED_BATCH_SIZE: "8"
      EMBED_TIMEOUT_S: "600"
      GRPC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        if: env.LLM_API_KEY != ''
      - uses: astral-sh/setup-uv@v6
        if: env.LLM_API_KEY != ''
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: env.LLM_API_KEY != ''
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('services/embed-server/embed_server/main.py', '.env.example') }}
      - name: Start infrastructure and the CPU embed-server
        if: env.LLM_API_KEY != ''
        run: |
          make up
          (make run-embedder > embed-server.log 2>&1 &)
          for _ in $(seq 1 300); do curl -sf localhost:8080/health && break; sleep 2; done
      - name: Run 10 questions per KB
        if: env.LLM_API_KEY != ''
        working-directory: eval
        run: for kb in kb1_retail kb2_saas_fr kb3_hr_ar; do uv run python run_eval.py --kb $kb --subset 10; done
      - name: Compare with the baseline
        if: env.LLM_API_KEY != ''
        run: cd eval && uv run python ci_check.py --tag c512-s10
      - name: Skipped
        if: env.LLM_API_KEY == ''
        run: echo "::notice::eval subset skipped (no LLM_API_KEY secret, e.g. fork PR)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/knowledge-base-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/knowledge-base-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint . --max-warnings 0
      - run: npx tsc --noEmit
      - run: npx next build
      - run: npm run licenses
      # The E2E suite (npx playwright test) needs the full stack with models and an LLM;
      # it runs with `make e2e` and joins CI with the GPU staging environment (Phase 7).

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main"
          push: false
