# BEAI RAG — local mode for manual tests (Windows + Docker Desktop, also works on Linux/macOS).
# Everything runs in Docker: no Python, uv or Node needed on the host.
#
#   docker compose -f docker-compose.windows.yml up -d --build      # start (first run: 15-30 min)
#   docker compose -f docker-compose.windows.yml down               # stop (data kept)
#
# Screen B: http://localhost:3000   ·   API docs: http://localhost:8000/docs
# Your LLM settings (LLM_*) come from .env — copy .env.windows.example to .env first.
# Guide (FR): docs/run-on-windows.md. Separate project name and volumes from the dev stack.
name: beai-rag-local

x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 60

# Shared by rag-api, the worker, the migration job and the embed-server (one image).
x-python: &python
  image: beai-rag-local-python:latest
  build:
    context: .
    dockerfile: deploy/local/Dockerfile.python
  env_file:
    - path: ${BEAI_LOCAL_ENV_FILE:-.env}
      required: true
  volumes: [models:/models]
  restart: unless-stopped

# Infrastructure addresses inside the Docker network (override anything in .env).
x-env: &env
  ENVIRONMENT: dev
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: local-only-qdrant-key
  DATABASE_URL: postgresql+asyncpg://beai:beai@postgres:5432/beai_rag
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: beai-kb
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio123
  EMBED_PROVIDER: local
  EMBED_URL: http://embed-server:8080
  EMBED_BATCH_SIZE: "8"
  EMBED_TIMEOUT_S: "600"
  RERANK_PROVIDER: ${RERANK_PROVIDER:-none}  # re-ranker off by default (CPU: several s/question)
  RERANK_URL: http://embed-server:8080
  JWT_ALGORITHMS: HS256
  JWT_SECRET: local-only-jwt-secret-change-me-32-bytes-min  # local tests only
  GRPC_ENABLED: "false"
  WORKER_CONCURRENCY: "1"

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: local-only-qdrant-key
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      <<: *hc
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beai
      POSTGRES_PASSWORD: beai
      POSTGRES_DB: beai_rag
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beai -d beai_rag"]
      <<: *hc
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *hc
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      # "ping" passes before the AMQP listener accepts connections; check the port itself.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      <<: *hc
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
              "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    volumes:
      - seaweedfs_data:/data
      - ./deploy/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      <<: *hc
    restart: unless-stopped

  # CPU embedding server (TEI /embed contract). Downloads harrier-oss-v1-0.6b (~1.2 GB) on the
  # first start into the "models" volume; later starts are offline-fast.
  embed-server:
    <<: *python
    working_dir: /src/services/embed-server
    command: ["uvicorn", "--factory", "embed_server.main:create_app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 180  # first start downloads the model
      start_period: 60s

  # One-shot: database migrations + Qdrant collection/indexes + S3 bucket.
  migrate:
    <<: *python
    working_dir: /src/services/rag-api
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap"]
    restart: "no"
    environment:
      <<: *env
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}

  rag-api:
    <<: *python
    working_dir: /src/services/rag-api
    command: ["uvicorn", "--factory", "app.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *env
      QDRANT_AUTO_CREATE: "false"
      S3_AUTO_CREATE_BUCKET: "false"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      migrate: {condition: service_completed_successfully}
      embed-server: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  ingestion-worker:
    <<: *python
    working_dir: /src/services/ingestion-worker
    command: ["python", "-m", "worker.main"]
    environment:
      <<: *env
    depends_on:
      migrate: {condition: service_completed_successfully}
      embed-server: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # Screen B (Next.js). The server-side proxy signs a local dev token for DEV_TENANT_ID.
  web:
    build:
      context: web/knowledge-base-ui
    environment:
      RAG_API_URL: http://rag-api:8000
      DEV_AUTH: "true"
      DEV_TENANT_ID: 00000000-0000-4000-8000-000000000001
      DEV_AGENT_ID: 00000000-0000-4000-8000-0000000000a1  # http://localhost:3000 opens this agent
      DEV_JWT_SECRET: local-only-jwt-secret-change-me-32-bytes-min
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      rag-api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  models:
  qdrant_data:
  postgres_data:
  seaweedfs_data:
