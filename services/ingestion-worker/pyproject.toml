[project]
name = "beai-ingestion-worker"
version = "0.1.0"
description = "BEAI RAG ingestion worker: parse -> chunk -> contextualise -> embed -> upsert"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beai-rag-core",
  "aio-pika>=9.5",
]

[tool.uv.sources]
beai-rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
