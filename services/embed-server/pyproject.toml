[project]
name = "beai-embed-server"
version = "0.1.0"
description = "CPU embedding server (sentence-transformers) exposing the TEI /embed contract"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sentence-transformers>=5.0",
  "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embed_server"]
