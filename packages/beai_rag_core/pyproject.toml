[project]
name = "beai-rag-core"
version = "0.1.0"
description = "Shared code for the BEAI RAG services: enums, tenancy, Qdrant store, DB models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "qdrant-client>=1.15",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aio-pika>=9.5",
  "aiobotocore>=2.17",
  "httpx>=0.28",
  "fastembed>=0.7",
  "tokenizers>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beai_rag_core"]
